name: Build JARVIS APK

on:
  push:
    paths: ['project.zip']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q project.zip -d unpacked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: unpacked/android_studio_codes
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: unpacked/android_studio_codes/app/build/outputs/apk/debug/app-debug.apk
